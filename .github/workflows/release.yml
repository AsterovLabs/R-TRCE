name: Release Packaging & Multi-Platform Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Multi-Platform Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Bundles
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          echo "Packaging R-TRCE $VERSION..."

          mkdir -p dist/linux dist/macos dist/windows

          # 1. Linux Bundle
          mkdir -p dist/linux/r-trce
          cp -r r_trce.R app.R start_studio.sh install.sh README.md AGENTS.md Context.md R dist/linux/r-trce/
          chmod +x dist/linux/r-trce/r_trce.R dist/linux/r-trce/app.R dist/linux/r-trce/start_studio.sh dist/linux/r-trce/install.sh
          tar -czf dist/r-trce-linux-all.tar.gz -C dist/linux r-trce

          # 2. macOS Bundle
          mkdir -p dist/macos/r-trce
          cp -r r_trce.R app.R start_studio.sh install.sh README.md AGENTS.md Context.md R dist/macos/r-trce/
          chmod +x dist/macos/r-trce/r_trce.R dist/macos/r-trce/app.R dist/macos/r-trce/start_studio.sh dist/macos/r-trce/install.sh
          tar -czf dist/r-trce-macos-all.tar.gz -C dist/macos r-trce

          # 3. Windows 10 / 11 Bundle
          mkdir -p dist/windows/r-trce
          cp -r r_trce.R app.R start_studio.bat install.bat install.ps1 README.md AGENTS.md Context.md R dist/windows/r-trce/
          zip -r dist/r-trce-windows-all.zip dist/windows/r-trce

          # Standalone installer scripts for direct download
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          cp install.bat dist/install.bat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/r-trce-linux-all.tar.gz
            dist/r-trce-macos-all.tar.gz
            dist/r-trce-windows-all.zip
            dist/install.sh
            dist/install.ps1
            dist/install.bat
          name: "R-TRCE ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## R-TRCE Release ${{ github.ref_name }}
            
            Multi-platform release of R-TRCE: Architectural analysis, AST comprehension, 6-point TRCE telemetry, and student pedagogical suite.
            
            ### ⚡ 1-Minute Quick Install

            #### 🐧 Linux & 🍏 macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/AsterovLabs/R-TRCE/main/install.sh | bash
            ```

            #### 🪟 Windows 11 & Windows 10 (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/AsterovLabs/R-TRCE/main/install.ps1 | iex
            ```

            ---

            ### 📦 Standalone Downloads
            
            | Platform | Download | Instructions |
            | :--- | :--- | :--- |
            | **Windows 10 & 11** | [`r-trce-windows-all.zip`](https://github.com/AsterovLabs/R-TRCE/releases/download/${{ github.ref_name }}/r-trce-windows-all.zip) | Unzip and double-click `install.bat` or `start_studio.bat` |
            | **Linux (All Distros)** | [`r-trce-linux-all.tar.gz`](https://github.com/AsterovLabs/R-TRCE/releases/download/${{ github.ref_name }}/r-trce-linux-all.tar.gz) | Extract and run `./install.sh` |
            | **macOS** | [`r-trce-macos-all.tar.gz`](https://github.com/AsterovLabs/R-TRCE/releases/download/${{ github.ref_name }}/r-trce-macos-all.tar.gz) | Extract and run `./install.sh` |
